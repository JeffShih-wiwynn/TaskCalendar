name: Playwright E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: playwright-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    # Playwright 1.60 browser dependencies support Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        timezone:
          - UTC
          - Asia/Taipei
    env:
      TZ: ${{ matrix.timezone }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e -- --reporter=html,line

      - name: Prepare artifact name
        if: always()
        env:
          TEST_TIMEZONE: ${{ matrix.timezone }}
        run: echo "ARTIFACT_TIMEZONE=${TEST_TIMEZONE//\//-}" >> "$GITHUB_ENV"

      - name: Upload browser reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ env.ARTIFACT_TIMEZONE }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            .calendar-dev/logs/
          retention-days: 7
